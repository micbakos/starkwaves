[package]
name = "starkwaves-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
starkwaves-client = { path = "../client" }
enum-as-inner = { workspace = true }
async-trait = { workspace = true }
ratatui = { version = "0.30.1", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { workspace = true }
log = { workspace = true }
color-eyre = "0.6"
starknet-rust-core = { workspace = true }
strum = "0.28.0"
derive_more = { version = "2.1", features = ["from"] }
dirs = { workspace = true }
dotenv = { workspace = true }
url = { version = "2", features = ["serde"] }
thiserror = { workspace = true }

[[bin]]
name = "starkwaves-tui"
path = "src/main.rs"
