[package]
name = "starkwaves-client"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.0", default-features = false, features = ["display"] }
thiserror = "2.0.17"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
starknet-rust = "0.19.0-rc.2"
starknet-rust-core = "0.19.0-rc.2"
starknet-rust-tokio-tungstenite = "0.19.0-rc.2"
reqwest = { version = "0.13.2", features = ["native-tls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rs_merkle = "1.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt", "time"] }
url = "2"
dotenv = "0.15.0"
enum-as-inner = "0.6.1"
rand = "0.8.5"
async-trait = "0.1.89"
chrono = "0.4"
dirs = "6.0.0"
log = "0.4.29"
colog = "1.4.0"
cainome = { version = "0.10.1", features = ["default"] }
clap = { version = "4", features = ["derive"] }

[patch.crates-io]
starknet-rust-core = { path = "../patches/starknet-rust-core" }

[dev-dependencies]
cairo-native = "0.8.0"
cairo-lang-sierra = "2.14.0"

[build-dependencies]
cainome = { version = "0.10.1", features = ["abigen-rs"] }

[features]
merkle-build = []

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"

[[bin]]
name = "reset"
path = "src/bin/reset.rs"

[[test]]
name = "cairo_rs_compat"
path = "tests/cairo_rs_compat.rs"
required-features = ["merkle-build"]

