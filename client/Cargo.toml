[package]
name = "starkwaves-client"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.0", default-features = false, features = ["display"] }
thiserror = "2.0.17"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
starknet = "0.17.0"
rs_merkle = "1.5.0"

[dev-dependencies]
cairo-native = "0.8.0"
cairo-lang-sierra = "2.14.0"

[features]
cairo-build = []

[[test]]
name = "cairo_compatibility"
path = "tests/cairo_board_verifier.rs"
required-features = ["cairo-build"]